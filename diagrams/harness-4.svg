  <rect x="133.36599999999999" y="184.9" width="392.43100000000004" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="133.36599999999999" y="184.9" width="392.43100000000004" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="145.36599999999999" y="198.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">VOX - features</text>
</g>
