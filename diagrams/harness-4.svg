  <rect x="40" y="329.8" width="579.163" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="329.8" width="579.163" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="343.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">TIGERBEETLE - the floor</text>
</g>
<polyline class="edge" data-from="PO" data-to="VO" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="329.5815,136.9 329.5815,184.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="VO" data-to="TI" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="329.5815,281.8 329.5815,329.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="P1" data-label="6 skills" data-shape="rectangle">
